name: site-check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 생성 결과가 kb/ 원본과 일치
        run: python tools/build_site.py --check
      - name: 내부 링크·앵커
        run: python tools/check_links.py
      - name: 논문 링크마다 요약 연결
        run: python tools/paper_links.py check
